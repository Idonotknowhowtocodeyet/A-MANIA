<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-MANIA | THE EMPIRE</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* New Start Overlay */
        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
        }
        .pulse { animation: pulse-red 2s infinite; }
        @keyframes pulse-red {
            0% { text-shadow: 0 0 10px #39ff14; }
            50% { text-shadow: 0 0 30px #39ff14, 0 0 50px #39ff14; }
            100% { text-shadow: 0 0 10px #39ff14; }
        }
    </style>
</head>
<body>

    <div id="start-overlay" onclick="this.style.display='none';">
        <h1 class="pulse" style="font-size: 3rem;">INITIALIZE EMPIRE</h1>
        <p>[ CLICK ANYWHERE TO BEGIN ]</p>
    </div>

    <div id="leaderboard">
        <div class="lb-title">TOP EMPIRES</div>
        <div id="top-list">LOADING...</div>
    </div>

    <h1 id="big-a">A</h1>

    <div id="stats">
        SCORE: <span id="score-val">0</span><br>
        COMBO: <span id="multi-box">x1.0</span>
    </div>

    <div id="chat-container">
        <div id="chat-display">SYSTEM: TYPE 'A' TO CHAT</div>
        <input type="text" id="chat-input" placeholder="TALK IN A..." maxlength="20">
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
